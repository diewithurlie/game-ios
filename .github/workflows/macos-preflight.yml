name: Fung Wan - semak persediaan iOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Ambil projek
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Uji pemeriksaan binaan
        run: python3 -m unittest discover -s tests -v
      - name: Periksa sumber runtime dan Xcode
        run: python3 tools/runtime_preflight.py --fetch --runtime runtime --report reports/preflight.json
      - name: Simpan laporan persediaan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fungwan-ios-preflight
          path: reports/
          retention-days: 7
          if-no-files-found: warn
